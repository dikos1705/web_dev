name: aeron-midterm
services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8083}:8000"
    environment:
      PORT: "8000"
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-aeron}
      DB_USER: ${POSTGRES_USER:-aeron}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your local .env}
      BOOKING_SECRET: ${BOOKING_SECRET:?Set BOOKING_SECRET in your local .env}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks: [app-network]
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeron}
      POSTGRES_USER: ${POSTGRES_USER:-aeron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [app-network]
  postman:
    image: postman/newman:alpine
    profiles: [tools]
    volumes:
      - ./postman:/etc/newman:ro
    entrypoint: [/bin/sh, -c]
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your local .env}
    command:
      - 'exec newman run /etc/newman/Aeron.postman_collection.json --env-var baseUrl=http://backend:8000 --env-var "adminKey=$$ADMIN_API_KEY" --reporters cli'
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-network]
volumes:
  postgres-data:
networks:
  app-network:
    driver: bridge
