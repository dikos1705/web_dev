name: Verify Aeron
on:
  push:
    branches: [midterm-project]
  pull_request:
    branches: [midterm-project]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python setup_env.py
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python verify.py --persistence
      - run: docker compose --profile tools run --rm postman
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down --volumes
