name: Compose API and persistence tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral local configuration
        shell: python
        run: |
          from pathlib import Path
          import secrets
          text = Path('.env.example').read_text().replace('replace-with-a-unique-local-password', secrets.token_hex(24))
          Path('.env').write_text(text)
      - name: Start backend and PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify API and persistence after recreating containers
        run: python3 verify.py --persistence
      - name: Container logs
        if: always()
        run: |
          docker compose logs --tail=80 || true
      - name: Clean up
        if: always()
        run: docker compose down || true
